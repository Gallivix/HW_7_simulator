plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 (одна зависимость вместо трёх)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    implementation 'com.github.javafaker:javafaker:1.0.2'

    // Selenide (актуальная версия)
    testImplementation 'com.codeborne:selenide:7.7.3'

    // Логирование
    testImplementation 'org.slf4j:slf4j-simple:2.0.7'
}

test {
    useJUnitPlatform()

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }

    // Передаём системные свойства в тесты
    systemProperty "selenide.browser", "chrome"
    systemProperty "chromeoptions.args", "--disable-blink-features=AutomationControlled,--disable-dev-shm-usage,--no-sandbox,--disable-gpu,--disable-extensions,--disable-plugins,--disable-popup-blocking,--disable-infobars"
}